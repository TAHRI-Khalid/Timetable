name: Build & Release Multi-OS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ----------------------------------------------------
  # 1. WINDOWS (x64) -> .msi
  # ----------------------------------------------------
  build-windows:
    name: Windows (x64 MSI)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JLink Image
        run: mvn clean compile javafx:jlink

      - name: Build Windows Installer (MSI)
        run: mvn jpackage:jpackage@win

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: package-windows-msi
          path: target/dist/*.msi

  # ----------------------------------------------------
  # 2. LINUX (x64) -> .deb, .rpm & Fat JAR
  # ----------------------------------------------------
  build-linux:
    name: Linux (.deb, .rpm & JAR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install packaging tools (RPM, Alien & Fakeroot)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot alien

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JLink Image
        run: mvn clean compile javafx:jlink

      - name: Build Linux DEB Package
        run: mvn jpackage:jpackage@linux-deb

      - name: Build Linux RPM Package
        run: |
          cd target/dist
          sudo alien -r -c *.deb
          sudo chown -R $USER:$USER .
          ls -la

      - name: Build Fat JAR
        run: mvn package -DskipTests

      - name: Upload Linux Packages & JAR
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-and-jar
          path: |
            target/dist/*.deb
            target/dist/*.rpm
            target/*-all.jar

  # ----------------------------------------------------
  # 3. macOS Apple Silicon (M1/M2/M3/M4 arm64) -> .dmg
  # (Note: GitHub a retiré les runners Intel macos-13 fin 2025)
  # ----------------------------------------------------
  build-macos:
    name: macOS (Apple Silicon DMG)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JLink Image
        run: mvn clean compile javafx:jlink

      - name: Build macOS DMG
        run: mvn jpackage:jpackage@mac

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: target/dist/*.dmg

  # ----------------------------------------------------
  # 4. RELEASE JOB : Publication sur GitHub Releases
  # ----------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List downloaded files
        run: ls -la release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
